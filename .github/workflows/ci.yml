name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The browser download is cached. System packages (apt) are not, so on a cache hit
      # we still run install-deps, which is much quicker than a full install.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install --with-deps chromium"

      - name: Install OS dependencies only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install-deps chromium"

      - name: Run tests (quarantine excluded)
        run: mvn -B -ntp test

      - name: Build Allure report
        if: always()
        run: npx --yes allure-commandline@2.29.0 generate target/allure-results --clean -o target/allure-report

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: allure-report
          path: target/allure-report
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: target/traces
          if-no-files-found: ignore

      - name: Publish report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

  deploy-report:
    needs: tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Flaky tests in the TestNG group "quarantine". Never blocks the build.
  # Selenium tests on a real Selenium Grid: a hub plus Chrome and Firefox nodes, started with Docker.
  selenium-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Start Selenium Grid
        run: docker compose -f docker/selenium-grid/docker-compose.yml up -d

      - name: Wait for the Grid to be ready
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:4444/status | grep -Eq '"ready": *true'; then
              echo "Grid ready"; curl -s http://localhost:4444/status | head -c 800; echo; exit 0
            fi
            sleep 2
          done
          docker compose -f docker/selenium-grid/docker-compose.yml logs
          exit 1

      - name: Run Selenium tests on the Grid (${{ matrix.browser }})
        run: mvn -B -ntp test -Dgroups=selenium -DexcludedGroups=quarantine -DgridUrl=http://localhost:4444 -Dbrowser=${{ matrix.browser }}

      # Playwright can use the same Grid through SELENIUM_REMOTE_URL (Chrome and Edge only).
      # Playwright documents this as experimental, so it never fails the build. The result is written
      # to the job summary, so a failure is visible and not hidden behind a green tick.
      - name: Playwright through the Grid (experimental, Chrome only)
        if: matrix.browser == 'chrome'
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444
        run: |
          if mvn -B -ntp test -Dtest=LoginTest -Dgroups=smoke -DexcludedGroups=quarantine,selenium; then
            echo "Playwright through the Grid: PASSED (experimental)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Playwright through the Grid: FAILED (experimental, does not fail the build)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Grid logs
        if: failure()
        run: docker compose -f docker/selenium-grid/docker-compose.yml logs --tail 200

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: allure-results-selenium-${{ matrix.browser }}
          path: target/allure-results
          if-no-files-found: ignore

      - name: Stop Selenium Grid
        if: always()
        run: docker compose -f docker/selenium-grid/docker-compose.yml down

  # Runs on main only, so pull requests do not pay for a second browser setup.
  quarantine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install --with-deps chromium"
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install-deps chromium"
      - run: mvn -B -ntp test -Dgroups=quarantine -DexcludedGroups=none -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
