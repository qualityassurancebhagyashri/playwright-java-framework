name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The browser download is cached. System packages (apt) are not, so on a cache hit
      # we still run install-deps, which is much quicker than a full install.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install --with-deps chromium"

      - name: Install OS dependencies only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install-deps chromium"

      - name: Run tests (quarantine excluded)
        run: mvn -B -ntp test

      - name: Build Allure report
        if: always()
        run: npx --yes allure-commandline@2.29.0 generate target/allure-results --clean -o target/allure-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/allure-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: target/traces
          if-no-files-found: ignore

      - name: Publish report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/allure-report

  deploy-report:
    needs: tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Flaky tests in the TestNG group "quarantine". Never blocks the build.
  # Runs on main only, so pull requests do not pay for a second browser setup.
  quarantine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install --with-deps chromium"
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: mvn -B -ntp -q test-compile exec:java "-Dexec.mainClass=com.microsoft.playwright.CLI" "-Dexec.classpathScope=test" "-Dexec.args=install-deps chromium"
      - run: mvn -B -ntp test -Dgroups=quarantine -DexcludedGroups=none -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
