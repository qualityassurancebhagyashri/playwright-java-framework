name: AI test review (advisory)

# Runs in parallel with CI. Nothing waits on it and it is not a required check.
on:
  pull_request:
    paths: ["src/test/**"]

permissions:
  contents: read
  pull-requests: write   # only to post the comment

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rule-based precheck (no AI)
        id: pre
        run: |
          python3 scripts/test_review_precheck.py origin/${{ github.base_ref }} > precheck.md
          cat precheck.md

      - name: Post precheck as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- test-precheck -->';
            const body = marker + '\n' + fs.readFileSync('precheck.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      # AI step. Needs the ANTHROPIC_API_KEY repo secret. Fork PRs do not get secrets, so this is skipped there.
      # Check the action's current inputs in its README before relying on this block.
      - name: AI review using the test-review skill
        if: ${{ env.HAS_KEY == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the test-review skill (.claude/skills/test-review/SKILL.md) on this pull request's changes under src/test.
            Rules are in AGENTS.md. The rule-based precheck is in precheck.md, do not repeat it.
            Post one comment in the format the skill defines. Advisory only. Do not modify files.
