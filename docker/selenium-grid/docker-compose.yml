# A small Selenium Grid 4: one hub, one Chrome node, one Firefox node.
#   docker compose -f docker/selenium-grid/docker-compose.yml up -d
#   open http://localhost:4444/ui   (Grid dashboard)
#   mvn test "-Dgroups=selenium" "-DgridUrl=http://localhost:4444"
#   docker compose -f docker/selenium-grid/docker-compose.yml down
services:
  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: selenium-hub
    ports:
      - "4442:4442"   # event bus: nodes publish
      - "4443:4443"   # event bus: nodes subscribe
      - "4444:4444"   # WebDriver endpoint and dashboard

  chrome:
    image: selenium/node-chrome:4.25.0
    shm_size: "2gb"   # Chrome crashes with the default 64 MB of shared memory
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3             # up to 3 parallel Chrome sessions on this node
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true

  firefox:
    image: selenium/node-firefox:4.25.0
    shm_size: "2gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
